version: "3.9"

# Runs on the NVIDIA DGX Spark.
# Cloudflare Tunnel exposes these services to the Vercel frontend.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: jw_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai:v0.6.3
    container_name: jw_vllm
    runtime: nvidia
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    command: >
      --model Qwen/Qwen2.5-14B-Instruct --served-model-name qwen/qwen3.5-397b-a17b --max-model-len 8192 --gpu-memory-utilization 0.85 --api-key ${DGX_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    restart: unless-stopped

  embed:
    image: ghcr.io/huggingface/text-embeddings-inference:1.5
    container_name: jw_embed
    runtime: nvidia
    command: >
      --model-id BAAI/bge-large-en-v1.5 --port 8001 --api-key ${DGX_API_KEY}
    ports:
      - "8001:8001"
    volumes:
      - tei_cache:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    restart: unless-stopped

  # Polite web crawler scheduler.
  # Runs the spider on a fixed interval and stores raw HTML to the shared volume.
  crawler:
    image: python:3.11-slim
    container_name: jw_crawler
    working_dir: /app
    volumes:
      - ../crawler:/app/crawler:ro
      - crawler_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "pip install -r crawler/requirements.txt && python -m crawler.scheduler --spider wol --interval-minutes 360 --limit 200"
    restart: unless-stopped

  # Indexer: turns crawled HTML into chunks, embeddings, and upserts into Qdrant.
  # Runs continuously and only processes NEW raw files.
  indexer:
    image: python:3.11-slim
    container_name: jw_indexer
    working_dir: /app
    depends_on:
      - qdrant
      - embed
    volumes:
      - ../indexer:/app/indexer:ro
      - crawler_data:/app/crawler_data:ro
      - indexer_state:/app/state
    environment:
      - PYTHONUNBUFFERED=1
      - QDRANT_URL=http://qdrant:6333
      - NVIDIA_EMBED_URL=http://embed:8001
      - NVIDIA_EMBED_MODEL=${NVIDIA_EMBED_MODEL:-NV-Embed-QA}
      - NVIDIA_API_KEY=${DGX_API_KEY}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_COLLECTION=jw_research
    command: >
      sh -c "pip install -r indexer/requirements.txt && python -m indexer.pipeline --raw-dir /app/crawler_data/raw --state /app/state/indexer_state.json --poll-seconds 30 --batch-size 16"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: jw_cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - qdrant
      - vllm
      - embed

volumes:
  qdrant_data:
  hf_cache:
  tei_cache:
  crawler_data:
  indexer_state:
