# Cloudflare Tunnel configuration for theocracy.me domain
# Routes backend services from DGX Spark to Cloudflare Tunnel
# Vercel frontend is configured separately in Cloudflare DNS

tunnel: jw-research
credentials-file: /etc/cloudflared/jw-research.json

ingress:
  # Backend API services routed through tunnel
  - hostname: qdrant.theocracy.me
    service: http://qdrant:6333
  - hostname: llm.theocracy.me
    service: http://vllm:8000
  - hostname: embed.theocracy.me
    service: http://embed:8001
  # Default 404 for any unmatched routes
  - service: http_status:404
